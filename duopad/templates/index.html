<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030813">
    <meta name="apple-mobile-web-app-title" content="DuoPad">
    <title>DuoPad - Smartphone Gamepad</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="shortcut icon" href="/static/icon-192.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    
    <script>
        // Force unregister stale Service Workers to prevent caching glitches
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var r of registrations) { r.unregister(); }
            }).catch(function() {});
        }
        if ('caches' in window) {
            caches.keys().then(function(keys) {
                for (var k of keys) { caches.delete(k); }
            }).catch(function() {});
        }
    </script>
    
    <style>
        /* ==========================================================================
           DuoPad - Cyberpunk Esports Xbox 360 Mobile Virtual Controller
           Pixel-faithful replication of official DuoPad controller interface
           ========================================================================== */
        :root {
            --bg-color: #030813;
            --border-cyan: rgba(0, 195, 255, 0.45);
            --border-cyan-bright: #00e5ff;
            --btn-bg: rgba(6, 18, 34, 0.65);
            --btn-active-bg: rgba(0, 229, 255, 0.28);
            --btn-active-glow: 0 0 20px rgba(0, 229, 255, 0.85);
            --knob-color: #00e5ff;
            --knob-glow: 0 0 20px #00e5ff, 0 0 35px rgba(0, 229, 255, 0.7);
            --ring-glow: 0 0 16px rgba(0, 229, 255, 0.45);
            --text-color: #ffffff;
            --status-color: #10b981;
        }

        /* Player 2 Radiant Neon Magenta Theme */
        body.theme-p2 {
            --bg-color: #0d020a;
            --border-cyan: rgba(255, 45, 117, 0.45);
            --border-cyan-bright: #ff2d75;
            --btn-bg: rgba(34, 6, 26, 0.65);
            --btn-active-bg: rgba(255, 45, 117, 0.28);
            --btn-active-glow: 0 0 20px rgba(255, 45, 117, 0.85);
            --knob-color: #ff2d75;
            --knob-glow: 0 0 20px #ff2d75, 0 0 35px rgba(255, 45, 117, 0.7);
            --ring-glow: 0 0 16px rgba(255, 45, 117, 0.45);
            --text-color: #ffffff;
            --status-color: #ff2d75;
            background: radial-gradient(ellipse at 50% 50%, #200618 0%, #0d020a 70%, #050104 100%) !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            background: radial-gradient(ellipse at 50% 50%, #081528 0%, #030813 70%, #02050b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-color);
            transition: background 0.4s ease;
        }

        /* Orientation Warning Overlay (Forces Landscape) */
        .orientation-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #081729 0%, #03070f 85%);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        @media (orientation: portrait) {
            .orientation-modal { display: flex; }
        }

        .orientation-card {
            background: rgba(9, 23, 38, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 32px 26px;
            border-radius: 26px;
            border: 1.5px solid var(--border-cyan);
            max-width: 320px;
            width: 88%;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.22), 0 20px 50px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .phone-anim-stage {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.12) 0%, transparent 68%);
        }

        .rotation-arc-svg {
            position: absolute;
            width: 110px;
            height: 110px;
            animation: arc-pulse 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
        }

        .device-phone {
            width: 44px;
            height: 80px;
            border: 2px solid var(--border-cyan-bright);
            border-radius: 10px;
            background: #06111f;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.5);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: phone-tilt 2.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            transform-origin: center center;
        }

        .phone-notch {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            background: rgba(0, 229, 255, 0.6);
            border-radius: 2px;
        }

        @keyframes phone-tilt {
            0%, 15% { transform: rotate(0deg) scale(1); }
            45%, 72% { transform: rotate(90deg) scale(1.08); }
            92%, 100% { transform: rotate(0deg) scale(1); }
        }

        @keyframes arc-pulse {
            0%, 15% { opacity: 0.3; transform: scale(0.95) rotate(0deg); }
            45%, 72% { opacity: 1; transform: scale(1.04) rotate(45deg); }
            92%, 100% { opacity: 0.3; transform: scale(0.95) rotate(0deg); }
        }

        .orientation-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .orientation-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.45;
            margin-bottom: 14px;
        }

        .orientation-desc strong {
            color: var(--border-cyan-bright);
            font-weight: 600;
        }

        .orientation-tip {
            font-size: 0.72rem;
            color: #64748b;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 6px 10px;
        }

        /* Status & Connection Overlay */
        .status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 8, 14, 0.94);
            backdrop-filter: blur(12px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .status-overlay:not(.active) {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .status-card {
            background: rgba(9, 24, 40, 0.92);
            border: 1.5px solid var(--border-cyan);
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 10px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 229, 255, 0.3);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3.5px solid rgba(255, 255, 255, 0.1);
            border-top: 3.5px solid var(--border-cyan-bright);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-banner {
            display: inline-block;
            padding: 6px 20px;
            background: var(--border-cyan-bright);
            color: #030810;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 30px;
            letter-spacing: 1px;
            box-shadow: 0 0 18px var(--border-cyan-bright);
            margin-top: 14px;
        }

        .btn-overlay {
            padding: 10px 24px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 14px;
        }

        .hidden { display: none !important; }

        /* Gamepad Stage */
        .gamepad-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. Top Row: LT | LB | Guid | RB | RT */
        .top-row {
            position: absolute;
            top: 4%;
            left: 0;
            width: 100vw;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 0 2vw;
            z-index: 10;
        }

        .pill-btn {
            width: clamp(68px, 14.5vw, 138px);
            height: clamp(34px, 8.8vh, 44px);
            border: 1.5px solid var(--border-cyan);
            background: var(--btn-bg);
            color: var(--text-color);
            border-radius: 9999px;
            font-size: clamp(0.85rem, 1.9vw, 1.05rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            transition: background 0.04s, border-color 0.04s, transform 0.04s, box-shadow 0.04s;
        }

        .pill-btn.active, .pill-btn:active {
            background: var(--btn-active-bg) !important;
            border-color: var(--border-cyan-bright) !important;
            color: #ffffff !important;
            box-shadow: var(--btn-active-glow) !important;
            transform: scale(0.95);
        }

        /* 2. Left Analog Stick (Upper-Left) */
        .pos-left-stick {
            position: absolute;
            left: 13%;
            top: 46%;
            transform: translate(-50%, -50%);
            width: clamp(135px, 20vw, 172px);
            height: clamp(135px, 20vw, 172px);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            z-index: 8;
        }

        .stick-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--border-cyan-bright);
            background: radial-gradient(circle, #081729 0%, #040e1b 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--ring-glow), inset 0 0 16px rgba(0, 0, 0, 0.85);
            transition: box-shadow 0.15s, border-color 0.15s;
        }

        .stick-ring.active-stick {
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.75), inset 0 0 16px rgba(0, 0, 0, 0.9);
        }

        body.theme-p2 .stick-ring.active-stick {
            box-shadow: 0 0 28px rgba(255, 45, 117, 0.75), inset 0 0 16px rgba(0, 0, 0, 0.9);
        }

        .stick-knob {
            width: clamp(48px, 7.2vw, 58px);
            height: clamp(48px, 7.2vw, 58px);
            border-radius: 50%;
            background: var(--knob-color);
            position: absolute;
            box-shadow: var(--knob-glow);
            pointer-events: none;
            transform: translate3d(0px, 0px, 0);
            will-change: transform;
        }

        /* 3. Capsule D-Pad (Lower-Left Cross) */
        .pos-dpad {
            position: absolute;
            left: 26.5%;
            top: 79%;
            transform: translate(-50%, -50%);
            width: clamp(200px, 27vw, 250px);
            height: clamp(155px, 36vh, 190px);
            z-index: 8;
            touch-action: none;
            pointer-events: none;
        }

        .dpad-capsule {
            border: 1.5px solid var(--border-cyan);
            background: var(--btn-bg);
            touch-action: none;
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            transition: background 0.04s, border-color 0.04s, box-shadow 0.04s;
        }

        .dpad-capsule.active, .dpad-capsule:active {
            background: var(--btn-active-bg) !important;
            border-color: var(--border-cyan-bright) !important;
            box-shadow: var(--btn-active-glow) !important;
        }

        .dpad-up {
            bottom: calc(50% + 12px);
            left: 50%;
            transform: translateX(-50%);
            width: clamp(30px, 4.3vw, 38px);
            height: clamp(62px, 15vh, 80px);
            border-radius: 9999px;
        }

        .dpad-down {
            top: calc(50% + 12px);
            left: 50%;
            transform: translateX(-50%);
            width: clamp(30px, 4.3vw, 38px);
            height: clamp(62px, 15vh, 80px);
            border-radius: 9999px;
        }

        .dpad-left {
            right: calc(50% + 18px);
            top: 50%;
            transform: translateY(-50%);
            width: clamp(64px, 12vw, 86px);
            height: clamp(28px, 6vh, 36px);
            border-radius: 9999px;
        }

        .dpad-right {
            left: calc(50% + 18px);
            top: 50%;
            transform: translateY(-50%);
            width: clamp(64px, 12vw, 86px);
            height: clamp(28px, 6vh, 36px);
            border-radius: 9999px;
        }

        /* 4. Center Cluster (Back/Start, LS/RS, Status HUD) */
        .pos-center-cluster {
            position: absolute;
            left: 44.5%;
            top: 31%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(7px, 1.6vh, 11px);
            z-index: 10;
        }

        .center-row {
            display: flex;
            gap: clamp(12px, 2.6vw, 24px);
            align-items: center;
            justify-content: center;
        }

        .pill-center {
            width: clamp(74px, 12.5vw, 104px);
            height: clamp(30px, 7.5vh, 38px);
            border-radius: 9999px;
            font-size: clamp(0.78rem, 1.7vw, 0.92rem);
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        /* Center Mini HUD Bar */
        .center-hud {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(7px, 1.5vw, 12px);
            margin-top: 1px;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px clamp(9px, 1.5vw, 13px);
            border-radius: 9999px;
            border: 1.2px solid var(--border-cyan);
            background: var(--btn-bg);
            font-size: clamp(0.72rem, 1.5vw, 0.82rem);
            font-weight: 700;
            color: var(--border-cyan-bright);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--status-color);
            box-shadow: 0 0 8px var(--status-color);
            animation: pulse-dot 1.5s infinite alternate;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .hud-ping {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: clamp(0.70rem, 1.4vw, 0.80rem);
            color: #cbd5e1;
            font-weight: 600;
        }

        .hud-btn-fs {
            width: clamp(28px, 4.2vw, 34px);
            height: clamp(26px, 5.2vh, 30px);
            border-radius: 8px;
            border: 1.2px solid var(--border-cyan);
            background: var(--btn-bg);
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .hud-btn-fs:active {
            color: #ffffff;
            border-color: var(--border-cyan-bright);
            background: var(--btn-active-bg);
        }

        .fs-icon {
            width: 15px;
            height: 15px;
        }

        /* 5. Right Analog Stick (Lower-Middle) */
        .pos-right-stick {
            position: absolute;
            left: 54%;
            top: 81%;
            transform: translate(-50%, -50%);
            width: clamp(135px, 20vw, 172px);
            height: clamp(135px, 20vw, 172px);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            z-index: 8;
        }

        /* 6. Action Diamond (Y, X, B, A) */
        .pos-action-diamond {
            position: absolute;
            left: 79%;
            top: 48%;
            transform: translate(-50%, -50%);
            width: clamp(230px, 33vw, 290px);
            height: clamp(200px, 46vh, 255px);
            z-index: 8;
            touch-action: none;
            pointer-events: none;
        }

        .squircle-btn {
            width: clamp(74px, 11.2vw, 95px);
            height: clamp(52px, 12vh, 66px);
            border-radius: clamp(18px, 2.6vw, 24px);
            border: 1.5px solid var(--border-cyan);
            background: var(--btn-bg);
            color: var(--text-color);
            font-size: clamp(1.2rem, 2.6vw, 1.55rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            touch-action: none;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            transition: background 0.04s, border-color 0.04s, box-shadow 0.04s, transform 0.04s;
        }

        .btn-y {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .btn-y.active, .btn-y:active {
            transform: translateX(-50%) scale(0.95);
            background: var(--btn-active-bg) !important;
            border-color: var(--border-cyan-bright) !important;
            box-shadow: var(--btn-active-glow) !important;
        }

        .btn-x {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        .btn-x.active, .btn-x:active {
            transform: translateY(-50%) scale(0.95);
            background: var(--btn-active-bg) !important;
            border-color: var(--border-cyan-bright) !important;
            box-shadow: var(--btn-active-glow) !important;
        }

        .btn-b {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        .btn-b.active, .btn-b:active {
            transform: translateY(-50%) scale(0.95);
            background: var(--btn-active-bg) !important;
            border-color: var(--border-cyan-bright) !important;
            box-shadow: var(--btn-active-glow) !important;
        }

        .btn-a {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .btn-a.active, .btn-a:active {
            transform: translateX(-50%) scale(0.95);
            background: var(--btn-active-bg) !important;
            border-color: var(--border-cyan-bright) !important;
            box-shadow: var(--btn-active-glow) !important;
        }
    </style>
</head>
<body>
    <!-- Orientation Warning Overlay (Forces Landscape) -->
    <div id="orientation-warning" class="orientation-modal">
        <div class="orientation-card">
            <div class="phone-anim-stage">
                <svg class="rotation-arc-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="2" stroke-dasharray="4 4" />
                    <path d="M 50 6 A 44 44 0 0 1 94 50" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="round" />
                    <polygon points="94,42 100,53 88,51" fill="#00e5ff" />
                </svg>
                <div class="device-phone">
                    <div class="phone-notch"></div>
                </div>
            </div>

            <h2 class="orientation-title">Rotate Your Phone</h2>
            <p class="orientation-desc">Turn your phone to <strong>Landscape mode</strong> for the dual-analog Xbox gamepad.</p>
            <div class="orientation-tip">💡 Tip: Turn on "Auto-Rotate" in phone settings</div>
        </div>
    </div>

    <!-- Status / Reconnection Overlay -->
    <div id="status-overlay" class="status-overlay active">
        <div class="status-card">
            <div class="spinner" id="status-spinner"></div>
            <h2 id="status-title">Connecting to PC...</h2>
            <p id="status-message">Ensure phone and PC are on the same Wi-Fi or Hotspot.</p>
            <div id="player-banner" class="player-banner hidden">
                <span id="player-badge">PLAYER 1</span>
            </div>
            <button id="btn-reconnect" class="btn-overlay hidden">Retry Connection</button>
        </div>
    </div>

    <!-- Main Gamepad Stage -->
    <div class="gamepad-stage">

        <!-- Top Shoulders Row: LT | LB | Guid | RB | RT -->
        <header class="top-row">
            <button class="pill-btn" id="btn-LT" data-trigger="LT">LT</button>
            <button class="pill-btn" id="btn-LB" data-btn="LB">LB</button>
            <button class="pill-btn" id="btn-GUIDE" data-btn="Guid">Guid</button>
            <button class="pill-btn" id="btn-RB" data-btn="RB">RB</button>
            <button class="pill-btn" id="btn-RT" data-trigger="RT">RT</button>
        </header>

        <!-- Left Analog Stick (Upper-Left) -->
        <div class="pos-left-stick" id="left-stick-zone">
            <div class="stick-ring">
                <div class="stick-knob" id="left-stick-knob"></div>
            </div>
        </div>

        <!-- Capsule D-Pad (Lower-Left Cross) -->
        <div class="pos-dpad">
            <button class="dpad-capsule dpad-up" id="btn-DPAD_UP" data-btn="DPAD_UP" aria-label="Up"></button>
            <button class="dpad-capsule dpad-left" id="btn-DPAD_LEFT" data-btn="DPAD_LEFT" aria-label="Left"></button>
            <button class="dpad-capsule dpad-right" id="btn-DPAD_RIGHT" data-btn="DPAD_RIGHT" aria-label="Right"></button>
            <button class="dpad-capsule dpad-down" id="btn-DPAD_DOWN" data-btn="DPAD_DOWN" aria-label="Down"></button>
        </div>

        <!-- Center Cluster (Back/Start, LS/RS, Mini Status HUD) -->
        <div class="pos-center-cluster">
            <div class="center-row">
                <button class="pill-btn pill-center" id="btn-BACK" data-btn="Back">Back</button>
                <button class="pill-btn pill-center" id="btn-START" data-btn="Start">Start</button>
            </div>
            <div class="center-row">
                <button class="pill-btn pill-center" id="btn-LS" data-btn="LS">LS</button>
                <button class="pill-btn pill-center" id="btn-RS" data-btn="RS">RS</button>
            </div>
            <div class="center-hud">
                <div class="hud-pill" id="hud-player-pill">
                    <span class="status-dot"></span>
                    <span id="hud-player-text">P1</span>
                </div>
                <div class="hud-pill hud-ping" id="hud-ping">-- ms</div>
                <button class="hud-btn-fs" id="btn-fullscreen" title="Toggle Fullscreen" aria-label="Fullscreen">
                    <svg viewBox="0 0 24 24" class="fs-icon">
                        <path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Right Analog Stick (Lower-Middle) -->
        <div class="pos-right-stick" id="right-stick-zone">
            <div class="stick-ring">
                <div class="stick-knob" id="right-stick-knob"></div>
            </div>
        </div>

        <!-- Action Diamond (Y, X, B, A) -->
        <div class="pos-action-diamond">
            <button class="squircle-btn btn-y" id="btn-Y" data-btn="Y">Y</button>
            <button class="squircle-btn btn-x" id="btn-X" data-btn="X">X</button>
            <button class="squircle-btn btn-b" id="btn-B" data-btn="B">B</button>
            <button class="squircle-btn btn-a" id="btn-A" data-btn="A">A</button>
        </div>

    </div>

    <!-- Scripts -->
    <script src="/static/socket.io.min.js"></script>
    <script src="/static/controller.js?v=50"></script>
    <script>
        // Auto-enter fullscreen on first tap for immersive play
        function enterFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                }
            }
        }
        window.addEventListener('touchstart', enterFullscreen, { passive: true, once: true });
        window.addEventListener('click', enterFullscreen, { passive: true, once: true });
    </script>
</body>
</html>
